[package]
name = "hikvision-service"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "hikvision-service"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
tokio-util  = { version = "0.7",  features = ["io"] }
axum        = "0.7"
tower-http  = { version = "0.5",  features = ["cors"] }
reqwest     = { version = "0.12", features = ["json", "native-tls", "stream"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
log         = "0.4"
fern        = "0.6"
chrono      = "0.4"
anyhow      = "1"
once_cell   = "1"
libloading  = "0.8"
digest_auth    = "0.3"
futures-util   = "0.3"
windows-service = "0.7"

[profile.release]
opt-level = 3
lto       = true
strip     = true
